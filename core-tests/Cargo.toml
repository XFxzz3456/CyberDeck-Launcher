[package]
name = "cyberdeck-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "native-tls",
  "charset",
  "http2",
  "system-proxy",
] }
walkdir = "2"
# wolvenkit.rs 深度扫描：tokio::process 异步调用 CLI + 30s 超时 kill
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
rust-ini = { version = "0.21.3", features = ["inline-comment"] }
# config_resolver 要解析 RED4ext 的 config.ini（实际是 TOML），
# 这里必须和 src-tauri 侧保持同一份依赖。
toml = "0.8"
# vortex_mirror.rs 的 LevelDB 读取在普通 lib 编译（cfg(test)=false）下也要能解析；
# 测试构建走 cfg(test) 的空实现，不访问真实状态库。
rusty-leveldb = "3"
